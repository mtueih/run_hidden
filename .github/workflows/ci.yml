name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - "src/**"
      - "include/**"
      - "cli/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: xmake configure
        run: xmake f -m debug

      - name: xmake build
        run: xmake -v
