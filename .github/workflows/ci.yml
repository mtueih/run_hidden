name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - "src/**"
      - "include/**"
      - "cli/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        os: [windows-latest]
        c_compiler: [cl]
        c_standard: ["99", "23"]

        exclude:
          - os: windows-latest
            c_compiler: cl
            c_standard: "23"

        include:
          - os: windows-latest
            c_compiler: cl
            c_standard: "17"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.c_compiler == 'cl'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: xmake configure
        run: xmake f -l c${{ matrix.c_standard }} --cc=${{ matrix.c_compiler }} -m debug

      - name: xmake build
        run: xmake
