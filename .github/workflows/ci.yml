name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - "src/**"
      - "include/**"
      - "cli/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        os: [windows-latest]
        cmake_version: [3.24.0, latest]
        c_compiler: [cl]
        c_standard: ["99", "17", "23"]

        exclude:
          - c_compiler: cl
            c_standard: "23"

    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 使用 Ninja 生成器时，识别不到 cl 编译器，因此需要显式处理。
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.c_compiler == 'cl'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake_version }}

      - name: Echo CMake version
        run: cmake --version

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_C_STANDARD=${{ matrix.c_standard }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache

      - name: CMake Build
        run: cmake --build build --parallel
