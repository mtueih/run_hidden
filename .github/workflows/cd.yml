name: CD

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: xmake configure and build
        run: xmake

      - name: xmake install
        run: xmake install -o run_hidden-${{ github.ref_name }}-win64

      - name: Package artifacts
        run: >
          Compress-Archive 
          -Path run_hidden-${{ github.ref_name }}-win64 
          -DestinationPath run_hidden-${{ github.ref_name }}-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: run_hidden-${{ github.ref_name }}-win64
          path: run_hidden-${{ github.ref_name }}-win64.zip

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
